<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Detail - UIU Social</title>
    <style>
        #event-image-wrap { width: 100%; height: 220px; }
        #event-image-wrap .featured-date { top: 16px; left: 16px; }
    </style>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/events.css">
    <link rel="stylesheet" href="css/club_detail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-graduation-cap mr-2 text-primary"></i>
                <div><a href="index.html">UIU Social</a></div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> Home</a>
                <a href="groups.html" class="nav-item"><i class="fa-solid fa-users-line"></i> Department Groups</a>
                <a href="club_hub.html" class="nav-item"><i class="fa-solid fa-puzzle-piece"></i> Club Hub</a>
                <a href="events.html" class="nav-item active"><i class="fa-regular fa-calendar"></i> Events</a>
                <a href="messages.html" class="nav-item"><i class="fa-regular fa-message"></i> Messages</a>
                <a href="map.html" class="nav-item"><i class="fa-solid fa-map-location-dot"></i> Campus Map</a>
                <a href="admin.html" class="nav-item"><i class="fa-solid fa-shield-halved"></i> Admin Panel</a>
                <!-- <div class="sidebar-section">
                    <h4 class="section-title">YOUR COMMUNITIES</h4>
                    <ul class="community-list">
                        <li><span class="dot text-danger"></span> IEEE Student Branch</li>
                        <li><span class="dot text-primary"></span> Robotics Club</li>
                    </ul>
                </div> -->
            </nav>
            <div class="sidebar-footer">
                <a href="login.html" class="nav-item sign-out"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out</a>
            </div>
        </aside>
        <main class="main-content-container">
            <header class="top-header">
                <div class="search-bar"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Search events..."></div>
                <div class="header-actions">
                    <div class="header-icon"><i class="fa-regular fa-bell"></i><span class="notification-badge"></span></div>
                    <div class="header-user"><img src="assets/images/students/kawsar.png?img=11" alt="User Avatar" class="avatar"></div>
                </div>
            </header>
            <div class="main-content" id="event-detail-container" style="padding:15px;">
                <div class="card mb-4">
                    <div class="featured-image" id="event-image-wrap">
                        <div class="featured-date" id="event-featured-date">
                            <span>OCT</span><strong>24</strong>
                        </div>
                    </div>
                    <div style="padding:24px;">
                        <h2 id="event-title">Loading...</h2>
                        <p class="text-muted" id="event-description"></p>
                        <div class="d-flex gap-3 mt-3 text-sm text-muted" id="event-info"></div>
                        <div class="mt-4 d-flex gap-2">
                            <button class="btn btn-primary" id="event-rsvp-btn"><i class="fa-solid fa-check"></i> RSVP</button>
                            <button class="btn btn-outline" id="event-ics-btn"><i class="fa-solid fa-calendar-plus"></i> Add to Calendar</button>
                        </div>
                        <div id="event-attendees" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/events.js"></script>
    <script src="js/event_detail.js"></script>
</body>
</html>
